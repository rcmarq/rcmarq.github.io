<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">

  <!-- Background -->
  <rect width="860" height="200" fill="#f5f5f7" rx="8"/>

  <!-- Notebook cell 1 -->
  <rect x="20" y="18" width="400" height="76" rx="5" fill="white" stroke="#d1d1d6" stroke-width="1"/>
  <!-- In [ ] label -->
  <text x="32" y="36" font-size="10" fill="#094f6a" font-weight="700">In [1]:</text>
  <!-- Code lines -->
  <text x="90" y="36" font-size="10.5" fill="#6e6e73">import </text>
  <text x="132" y="36" font-size="10.5" fill="#094f6a">numpy</text>
  <text x="175" y="36" font-size="10.5" fill="#6e6e73"> as np</text>
  <text x="90" y="51" font-size="10.5" fill="#6e6e73">import </text>
  <text x="132" y="51" font-size="10.5" fill="#094f6a">cosmo</text>
  <text x="172" y="51" font-size="10.5" fill="#6e6e73"> as cs</text>
  <text x="90" y="66" font-size="10.5" fill="#1c1c1e">spike </text>
  <text x="122" y="66" font-size="10.5" fill="#6e6e73">= cs.</text>
  <text x="148" y="66" font-size="10.5" fill="#094f6a">optimize_spike</text>
  <text x="261" y="66" font-size="10.5" fill="#6e6e73">(isotopes, </text>
  <text x="318" y="66" font-size="10.5" fill="#c0392b">n</text>
  <text x="325" y="66" font-size="10.5" fill="#6e6e73">=4)</text>
  <!-- Output -->
  <text x="32" y="85" font-size="10" fill="#094f6a" font-weight="700">Out[1]:</text>
  <text x="90" y="85" font-size="10.5" fill="#6e6e73">Optimal spike: </text>
  <text x="178" y="85" font-size="10.5" fill="#1c1c1e">[0.0842, 0.3156, 0.4821, 0.1181]</text>

  <!-- Notebook cell 2 -->
  <rect x="20" y="106" width="400" height="78" rx="5" fill="white" stroke="#d1d1d6" stroke-width="1"/>
  <text x="32" y="124" font-size="10" fill="#094f6a" font-weight="700">In [2]:</text>
  <text x="90" y="124" font-size="10.5" fill="#6e6e73"># NebCondense — condensation sequence</text>
  <text x="90" y="139" font-size="10.5" fill="#1c1c1e">T_cond </text>
  <text x="132" y="139" font-size="10.5" fill="#6e6e73">= nebula.</text>
  <text x="175" y="139" font-size="10.5" fill="#094f6a">condense</text>
  <text x="222" y="139" font-size="10.5" fill="#6e6e73">(P=</text>
  <text x="241" y="139" font-size="10.5" fill="#c0392b">1e-4</text>
  <text x="265" y="139" font-size="10.5" fill="#6e6e73">, solar_comp)</text>
  <text x="90" y="154" font-size="10.5" fill="#1c1c1e">nebula.</text>
  <text x="128" y="154" font-size="10.5" fill="#094f6a">plot_sequence</text>
  <text x="218" y="154" font-size="10.5" fill="#6e6e73">(T_cond, minerals)</text>
  <!-- mini plot hint -->
  <text x="32" y="174" font-size="10" fill="#094f6a" font-weight="700">Out[2]:</text>
  <text x="90" y="174" font-size="10.5" fill="#6e6e73">Figure saved → condensation_sequence.pdf</text>

  <!-- Decorative mini chart on the right -->
  <rect x="450" y="18" width="390" height="166" rx="5" fill="white" stroke="#d1d1d6" stroke-width="1"/>

  <!-- Chart title -->
  <text x="466" y="38" font-size="10.5" fill="#6e6e73">Condensation Sequence  |  log P = −4 atm</text>

  <!-- Y axis label -->
  <text x="460" y="130" font-size="9" fill="#6e6e73" transform="rotate(-90 460 130)">Fraction condensed</text>

  <!-- X axis -->
  <line x1="490" y1="155" x2="825" y2="155" stroke="#d1d1d6" stroke-width="1"/>
  <!-- Y axis -->
  <line x1="490" y1="48" x2="490" y2="155" stroke="#d1d1d6" stroke-width="1"/>

  <!-- X tick labels -->
  <text x="490" y="167" font-size="8.5" fill="#6e6e73" text-anchor="middle">2000</text>
  <text x="574" y="167" font-size="8.5" fill="#6e6e73" text-anchor="middle">1800</text>
  <text x="658" y="167" font-size="8.5" fill="#6e6e73" text-anchor="middle">1600</text>
  <text x="741" y="167" font-size="8.5" fill="#6e6e73" text-anchor="middle">1400</text>
  <text x="825" y="167" font-size="8.5" fill="#6e6e73" text-anchor="middle">1200</text>
  <text x="657" y="180" font-size="8.5" fill="#6e6e73" text-anchor="middle">Temperature (K)</text>

  <!-- Y tick labels -->
  <text x="484" y="158" font-size="8.5" fill="#6e6e73" text-anchor="end">0</text>
  <text x="484" y="120" font-size="8.5" fill="#6e6e73" text-anchor="end">0.5</text>
  <text x="484" y="52" font-size="8.5" fill="#6e6e73" text-anchor="end">1.0</text>
  <line x1="488" y1="119" x2="492" y2="119" stroke="#d1d1d6" stroke-width="1"/>

  <!-- Corundum line -->
  <polyline points="490,155 530,154 545,148 555,60 570,52 600,51 825,51"
    fill="none" stroke="#094f6a" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Perovskite line -->
  <polyline points="490,155 580,155 600,148 615,105 625,85 640,80 825,80"
    fill="none" stroke="#2980b9" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Melilite line -->
  <polyline points="490,155 620,155 645,150 660,120 675,100 690,95 825,95"
    fill="none" stroke="#27ae60" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Forsterite line -->
  <polyline points="490,155 700,155 725,148 740,130 760,118 780,115 825,115"
    fill="none" stroke="#e67e22" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Legend -->
  <rect x="700" y="48" width="10" height="2" fill="#094f6a" rx="1"/>
  <text x="714" y="52" font-size="8.5" fill="#6e6e73">Corundum</text>
  <rect x="700" y="60" width="10" height="2" fill="#2980b9" rx="1"/>
  <text x="714" y="64" font-size="8.5" fill="#6e6e73">Perovskite</text>
  <rect x="700" y="72" width="10" height="2" fill="#27ae60" rx="1"/>
  <text x="714" y="76" font-size="8.5" fill="#6e6e73">Melilite</text>
  <rect x="700" y="84" width="10" height="2" fill="#e67e22" rx="1"/>
  <text x="714" y="88" font-size="8.5" fill="#6e6e73">Forsterite</text>

</svg>
