<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#094f6a" stroke-linecap="round" stroke-linejoin="round">

  <!-- Outermost disk ellipses -->
  <ellipse cx="100" cy="100" rx="90" ry="36" stroke-width="1.6"/>
  <ellipse cx="100" cy="100" rx="76" ry="30" stroke-width="1.4"/>
  <ellipse cx="100" cy="100" rx="61" ry="24" stroke-width="1.3"/>
  <ellipse cx="100" cy="100" rx="46" ry="18" stroke-width="1.2"/>
  <ellipse cx="100" cy="100" rx="31" ry="12" stroke-width="1.2"/>

  <!-- Gaps in outer rings (right side) -->
  <path d="M 173 107 Q 185 103 190 100" stroke-width="2.2" stroke="#f5f5f7"/>
  <path d="M 163 111 Q 178 105 183 101" stroke-width="2" stroke="#f5f5f7"/>

  <!-- Gaps in outer rings (left side) -->
  <path d="M 27 93 Q 15 97 10 100" stroke-width="2.2" stroke="#f5f5f7"/>
  <path d="M 37 89 Q 22 95 17 99" stroke-width="2" stroke="#f5f5f7"/>

  <!-- Sun in center -->
  <circle cx="100" cy="100" r="5" stroke-width="1.5"/>

  <!-- Sun rays -->
  <line x1="100" y1="90" x2="100" y2="86" stroke-width="1.4"/>
  <line x1="100" y1="110" x2="100" y2="114" stroke-width="1.4"/>
  <line x1="90"  y1="100" x2="86"  y2="100" stroke-width="1.4"/>
  <line x1="110" y1="100" x2="114" y2="100" stroke-width="1.4"/>
  <line x1="93"  y1="93"  x2="90"  y2="90"  stroke-width="1.4"/>
  <line x1="107" y1="107" x2="110" y2="110" stroke-width="1.4"/>
  <line x1="107" y1="93"  x2="110" y2="90"  stroke-width="1.4"/>
  <line x1="93"  y1="107" x2="90"  y2="110" stroke-width="1.4"/>

</svg>
